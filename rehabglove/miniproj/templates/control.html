<!-- control.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Arduino via WebSocket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            padding: 20px;
        }
        input[type="number"] {
            width: 100px;
            padding: 5px;
            margin: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        .status {
            font-size: 18px;
            margin-top: 20px;
        }
        .connected {
            color: green;
        }
        .disconnected {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Arduino WebSocket Control</h1>
    <label for="threshold">Threshold:</label>
    <input type="number" id="threshold" value="100" min="0" step="1">
    <button onclick="updateThreshold()">Update Threshold</button>

    <div class="status" id="status">Connecting...</div>

    <h3>Current Threshold: <span id="current-threshold">100</span></h3>

    <script>
        // Replace this with the ESP32 WebSocket server's IP
        var ws = new WebSocket("ws://192.168.250.254:81"); 

        // Update WebSocket connection status
        ws.onopen = function() {
            document.getElementById("status").textContent = "Connected to ESP32!";
            document.getElementById("status").classList.remove('disconnected');
            document.getElementById("status").classList.add('connected');
        };

        ws.onclose = function() {
            document.getElementById("status").textContent = "Disconnected from ESP32!";
            document.getElementById("status").classList.remove('connected');
            document.getElementById("status").classList.add('disconnected');
        };

        ws.onerror = function() {
            document.getElementById("status").textContent = "WebSocket Error!";
            document.getElementById("status").classList.remove('connected');
            document.getElementById("status").classList.add('disconnected');
        };

        // Send the updated threshold to the WebSocket
        function updateThreshold() {
            var thresholdValue = document.getElementById("threshold").value;

            // Send JSON string with the threshold update
            ws.send(`threshold:${thresholdValue}`);

            // Update current threshold display
            document.getElementById("current-threshold").textContent = thresholdValue;
        }
    </script>
</body>
</html>
